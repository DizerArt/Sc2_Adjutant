[package]
name = "sc2-adjutant-compose"
version = "1.1.11"
edition = "2024"
publish = false
default-run = "sc2-adjutant-compose"

[workspace]
members = ["."]
resolver = "3"

[lib]
name = "sc2_compose_core"
crate-type = ["lib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:rfd"]

[[bin]]
name = "sc2-adjutant-compose"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
csv = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
mime_guess = "2"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tga"] }
gif = "0.13"
rfd = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"
png = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
